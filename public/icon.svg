<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MyTrip">
  <!-- Colours are the app's own background and primary tokens from
       globals.css, written literally because an icon is fetched by the OS,
       which has no stylesheet. Note: no double hyphens in this comment, which
       XML forbids and strict parsers reject.

       A single bold pin, because this is read at 40px on a home screen. An
       earlier version drew a dashed route around the pin; at icon size the
       dashes collapsed into a ring of dots that looked like a cog. -->
  <rect width="512" height="512" rx="112" fill="#faf7f2" />

  <!-- The ground the pin stands on, so it does not float. -->
  <ellipse cx="256" cy="404" rx="74" ry="20" fill="#9a7658" opacity="0.16" />

  <path
    d="M256 96c-70 0-127 57-127 127 0 95 127 181 127 181s127-86 127-181c0-70-57-127-127-127z"
    fill="#9a7658"
  />
  <circle cx="256" cy="223" r="49" fill="#faf7f2" />
</svg>
