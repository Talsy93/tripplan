<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7A74"/>
      <stop offset="100%" stop-color="#0D4247"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- The compass: lucide's glyph (24-unit grid), the in-app logo tile's mark.
       The needle's north half is the one terracotta in the design. No wordmark:
       the phone writes the app's name under its icon, and the font here would
       be librsvg's fallback, not Rubik. -->
  <g transform="translate(96 96) scale(13.333)">
    <circle cx="12" cy="12" r="10" stroke="#FFFFFF" stroke-width="1.8"/>
    <polygon points="16.24 7.76 14.12 14.12 9.88 9.88" fill="#E2582F" stroke="#E2582F" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="7.76 16.24 9.88 9.88 14.12 14.12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

</svg>
